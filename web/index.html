<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>个人工作台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=jwt2">
  <!-- Markdown 渲染依赖固定在本地，离线启动时也可用。 -->
  <link rel="stylesheet" href="vendor/github-dark-11.9.0.min.css">
  <script src="vendor/highlight-11.9.0.min.js"></script>
  <script src="vendor/marked-4.3.0.min.js"></script>
  <script src="vendor/dompurify-3.2.6.min.js"></script>
  <script defer src="app.js?v=jwt2"></script>
</head>
<body>
  <div id="title-bar" class="title-bar">
    <div class="title-bar-controls">
      <button id="btn-close" class="traffic-close" title="关闭" aria-label="关闭"></button>
      <button id="btn-minimize" class="traffic-minimize" title="最小化" aria-label="最小化"></button>
      <button id="btn-maximize" class="traffic-maximize" title="最大化" aria-label="最大化"></button>
    </div>
    <div class="title-bar-title">个人工作台</div>
    <div class="title-bar-spacer"></div>
  </div>
  <div class="app-shell">
    <div class="workspace">
      <aside class="sidebar">
        <div class="brand"><div class="brand-mark">W</div><div><strong>工作站</strong><span>WORKSTATION</span></div></div>
        <div class="sidebar-label">主菜单</div>
        <nav id="main-nav" class="main-nav">
          <button class="nav-item active" data-view="dashboard"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg></span><span>仪表盘</span></button>
          <button class="nav-item" data-view="kanban"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true"><rect x="4" y="4" width="4.5" height="16" rx="1"/><rect x="10" y="4" width="4.5" height="10" rx="1"/><rect x="16" y="4" width="4.5" height="13" rx="1"/></svg></span><span>任务看板</span><b id="kanban-badge" class="nav-badge" hidden></b></button>
          <button class="nav-item" data-view="notes"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></span><span>笔记</span></button>
          <button class="nav-item" data-view="github"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></span><span>GitHub</span><b id="github-badge" class="nav-badge" hidden></b></button>
          <button class="nav-item" data-view="tools"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></span><span>开发工具</span></button>
          <button class="nav-item" data-view="snippets"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></span><span>代码片段</span></button>
          <button class="nav-item" data-view="git"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true"><line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg></span><span>本地 Git</span></button>
          <button class="nav-item" data-view="logs"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span><span>开发日志</span></button>
          <button class="nav-item" data-view="focus"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span><span>番茄专注</span></button>
        </nav>
        <div class="sidebar-label">其他</div>
        <nav class="main-nav"><button class="nav-item" data-view="settings"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span><span>连接设置</span></button></nav>
        <div class="sidebar-footer">
          <div id="server-status" class="server-status"><span class="status-dot"></span><span>检查服务中</span></div>
          <div class="user-row"><div id="sidebar-avatar" class="avatar">L</div><div><strong id="sidebar-name">Liu</strong><span id="sidebar-subtitle">本地工作区</span></div><button id="sidebar-refresh" class="icon-button" title="刷新数据">↻</button></div>
        </div>
      </aside>
      <main class="main-content">
        <header class="topbar"><div><div class="eyebrow">PERSONAL WORKSTATION</div><h1 id="page-title">仪表盘</h1></div><div class="top-actions"><span id="last-updated" class="muted">尚未同步</span><button id="refresh-btn" class="icon-button" title="刷新当前页面">↻</button><button id="quick-add" class="primary-button">＋ 新建</button></div></header>
        <section id="content" class="content"></section>
      </main>
    </div>
  </div>
  <dialog id="task-dialog" class="modal"><form method="dialog" id="task-form"><div class="modal-head"><div><span class="eyebrow" id="task-dialog-eyebrow">NEW TASK</span><h2 id="task-dialog-title">新建任务</h2></div><button type="button" class="icon-button dialog-close" data-dialog-close="task-dialog" title="关闭">×</button></div><label>标题<input name="title" required maxlength="200" placeholder="例如：整理 API 文档"></label><label>描述<textarea name="description" rows="4" placeholder="补充任务背景"></textarea></label><div class="form-row"><label>优先级<select name="priority"><option value="medium">中</option><option value="high">高</option><option value="low">低</option></select></label><label>截止日期<input name="due_date" type="date"></label></div><label id="task-column-field">任务列<select name="column_id" id="task-column"></select></label><div class="modal-actions"><button type="button" class="secondary-button dialog-close" data-dialog-close="task-dialog">取消</button><button value="default" id="task-submit" class="primary-button">创建任务</button></div></form></dialog>
  <dialog id="note-dialog" class="modal"><form method="dialog" id="note-form"><div class="modal-head"><div><span class="eyebrow" id="note-dialog-eyebrow">NEW NOTE</span><h2 id="note-dialog-title">新建笔记</h2></div><button type="button" class="icon-button dialog-close" data-dialog-close="note-dialog" title="关闭">×</button></div><label>标题<input name="title" required maxlength="200" placeholder="笔记标题"></label><div class="note-editor-toolbar"><span class="note-editor-label">内容（支持 Markdown）</span><div class="note-mode-switch" role="tablist"><button type="button" class="note-mode active" data-note-mode="edit">编辑</button><button type="button" class="note-mode" data-note-mode="preview">预览</button><button type="button" class="note-mode" data-note-mode="split">分栏</button></div></div><div class="note-editor-body"><label class="note-editor"><span class="sr-only">编辑内容</span><textarea name="content" rows="10" placeholder="使用 Markdown 记录：# 标题、- 列表、```代码块```"></textarea></label><div class="note-preview" aria-live="polite"></div></div><label>标签<input name="tags" placeholder="用逗号分隔，例如：MVP,设计"></label><div class="modal-actions"><button type="button" class="secondary-button dialog-close" data-dialog-close="note-dialog">取消</button><button value="default" id="note-submit" class="primary-button">保存笔记</button></div></form></dialog>
  <dialog id="board-dialog" class="modal"><form method="dialog" id="board-form"><div class="modal-head"><div><span class="eyebrow">NEW BOARD</span><h2>新建看板</h2></div><button type="button" class="icon-button dialog-close" data-dialog-close="board-dialog" title="关闭">×</button></div><label>看板名称<input name="name" required maxlength="100" placeholder="例如：个人项目、学习计划"></label><div class="modal-actions"><button type="button" class="secondary-button dialog-close" data-dialog-close="board-dialog">取消</button><button value="default" class="primary-button">创建看板</button></div></form></dialog>
  <dialog id="column-dialog" class="modal"><form method="dialog" id="column-form"><div class="modal-head"><div><span class="eyebrow">NEW COLUMN</span><h2>新建任务列</h2></div><button type="button" class="icon-button dialog-close" data-dialog-close="column-dialog" title="关闭">×</button></div><label>列名称<input name="name" required maxlength="100" placeholder="例如：待审核、阻塞"></label><div class="modal-actions"><button type="button" class="secondary-button dialog-close" data-dialog-close="column-dialog">取消</button><button value="default" class="primary-button">创建任务列</button></div></form></dialog>
  <dialog id="confirm-dialog" class="modal confirm-modal"><form method="dialog" id="confirm-form"><div class="confirm-mark">!</div><div><h2 id="confirm-title">确认操作</h2><p id="confirm-message"></p></div><div class="modal-actions"><button type="button" class="secondary-button" id="confirm-cancel">取消</button><button value="default" class="primary-button danger-button" id="confirm-submit">确认</button></div></form></dialog>
  <div id="toast" class="toast" role="status"></div>
</body>
</html>
