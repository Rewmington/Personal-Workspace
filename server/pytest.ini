[pytest]
testpaths = tests
addopts = -v --tb=short
# 压制已知无害的第三方库弃用提示（starlette 建议改用 httpx2、anyio BlockingPortal 别名）。
# 它们不影响当前测试功能，纯属上游噪音。
filterwarnings =
    ignore:.*starlette\.testclient.*is deprecated:UserWarning
    ignore:.*anyio\.abc\.BlockingPortal.*alias is deprecated:DeprecationWarning
# Playwright 浏览器配置
markers =
    ui: Web UI tests (requires server running at localhost:8080)
